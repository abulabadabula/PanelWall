name: validate-panelwall

on:
  push:
    branches:
      - main
      - review/engineering-safety-and-build-fixes
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run calculation regression tests
        run: npm test
      - name: Build production bundle
        run: npm run build
